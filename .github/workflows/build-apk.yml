name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_local_ai:
        description: 'Build native llama.cpp libs so Local AI (on-device) works in the APK'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Android NDK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_local_ai }}
        uses: actions/cache@v4
        with:
          path: ~/android-ndk
          key: android-ndk-r27b-linux
      - name: Build llama.cpp native libs (Local AI)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_local_ai }}
        run: |
          NDK_DIR=~/android-ndk/android-ndk-r27b
          if [ ! -d "$NDK_DIR" ]; then
            mkdir -p ~/android-ndk
            curl -sL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
            unzip -q /tmp/ndk.zip -d ~/android-ndk
          fi
          ./scripts/build-llama-android.sh "$NDK_DIR"
      - name: Verify native libs present
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_local_ai }}
        run: |
          for f in libggml-base.so libggml-cpu.so libggml.so libllama.so; do
            test -f "app/src/main/cpp/llama/prebuilt/arm64-v8a/$f" || { echo "MISSING $f"; exit 1; }
          done
          echo "All llama.cpp native libs present"
      - name: Generate gradle.properties (gitignored upstream)
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon -x lint
      - uses: actions/upload-artifact@v4
        with:
          name: gos-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
